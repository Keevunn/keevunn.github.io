<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Kevwe Anaughe Portfolio</title>

    <link rel="stylesheet" href="https://unpkg.com/xp.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- desktop -->
    <div id="desktop">
        <div class="desktop-icon" id="icon-projects">
            <img src="assets/icons/Projects.ico" alt="Projects Folder">
            <span>My Projects</span>
        </div>
    </div>

    <!-- blank window -->
    <div class="window" id="window-projects" >
        <div class="title-bar">
            <div class="title-bar-text">Projects</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Restore"></button>
                <button aria-label="Close"></button>
            </div>
        </div>
        
        <div class="window-body">
            <p>Blank window</p>
        </div>
    </div>

    <!-- taskbar -->
    <div id="taskbar">
        <button id="start-button">start</button>
        
        <div id="taskbar-tasks"></div>
        
        <div id="system-tray">
            <span id="clock">12:00 PM</span>
        </div>
    </div>

</body>

</html>
