<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Kevwe Anaughe Portfolio</title>

    <link rel="stylesheet" href="https://unpkg.com/xp.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/window.css" />
    <link rel="stylesheet" href="css/taskbar.css" />
    
    <script src="js/windows.js" defer></script>
    <script src="js/desktop.js" defer></script>
</head>

<body>
    <!-- ========================= 
            Desktop
         ========================= -->
    <div id="desktop">
        <div class="desktop-icon" id="icon-projects" data-target="window-projects">
            <img src="assets/icons/Projects.ico" alt="Projects Folder">
            <span>My Projects</span>
        </div>
    </div>

    <!-- ========================= 
            Windows
         ========================= -->
    <!-- eventually make inactive windows change colour -->
    <div class="window" id="window-projects" data-target="taskbar-task-projects" >
        <div class="title-bar">
            <div class="title-bar-icon">
                <img src="assets/icons/Projects.ico" alt="Projects Window Icon">
            </div>
            <div class="title-bar-text">My Projects</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize" class="window-min"></button>
                <button aria-label="Maximize" class="window-max"></button>
                <button aria-label="Restore" class="window-restore"></button>
                <button aria-label="Close" class="window-close"></button>
            </div>
        </div>
        
        <div class="window-body">
            <nav class="window-toolbar">
                <div class="toolbar-back">
                    <img src="assets/icons/Back.png" alt="Back Button Icon"/>
                    <img src="assets/icons/Forward.png" alt="Forward Button Icon"/>
                </div>
                <div class="toolbar-addressbar">
                    <div class="toolbar-addressbar-field">
                        <span>
                            <img src="assets/icons/MyComputer.png" alt="My Computer Icon">
                            My Projects/
                        </span>
                    </div>
                </div>
                <div class="toolbar-view">
                    <img src="assets/icons/TileView.png" alt="Tile View Icon"/>
                </div>
            </nav>
            
            
            
            <div class="window-content">
                <div class="content-leftpanel"></div>
                <div class="content-rightpanel"></div>
            </div>
        </div>
    </div>

    <!-- ========================= 
            Taskbar
         ========================= -->
    <div id="taskbar">
        <button id="start-button">start</button>
        
        <div id="taskbar-tasks">
            <div class="taskbar-task active" id="taskbar-task-projects" data-target="window-projects">
                <img src="assets/icons/Projects.ico" alt="My Projects"/>
                My Projects
            </div>
        </div>
        
        <div id="system-tray">
            <span id="clock">12:00 PM</span>
        </div>
    </div>

</body>

</html>
